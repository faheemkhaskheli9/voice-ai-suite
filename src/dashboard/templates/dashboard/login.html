<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Log in — Voice AI Suite</title>
</head>
<body>
  <h1>Log in</h1>
  {% if form.errors %}
  <p>Incorrect username or password.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
  </form>
</body>
</html>
